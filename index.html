<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credencial</title>
    <style>
        /* Reseteo básico y fondo blanco */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Contenedor principal para la imagen */
        .image-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Estilo de la imagen */
        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Contenedor para el enlace en la parte inferior */
        .link-container {
            margin-top: 30px;
        }

        .link-container a {
            text-decoration: none;
            color: #333;
            background-color: #f0f0f0;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="image-container">
        <!-- Imagen que se mostrará -->
        <img src="image.png" alt="Credencial">
    </div>

    <div class="link-container">
        <!-- Enlace y texto del botón -->
        <a href="https://mi.universidad.cl">Ir al sitio web</a>
    </div>

</body>
</html>
